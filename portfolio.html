<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio — Kilian Torres</title>
    <meta
      name="description"
      content="Escritorio digital de Kilian Torres. Portfolio de diseño gráfico y desarrollo."
    />
    <meta name="pinterest" content="nopin" />
    <meta name="pinterest-rich-pin" content="false" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,300;1,9..144,500;1,9..144,700&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/desktop.css?v=desk8" />
  </head>
  <body class="os">
    <div class="cursor-ring" id="cursor-ring" aria-hidden="true">
      <span class="cursor-iris cursor-iris-a"></span>
      <span class="cursor-iris cursor-iris-b"></span>
    </div>
    <div class="cursor-dot" id="cursor-dot" aria-hidden="true"></div>

    <div class="os-frame" id="os-frame">
      <div class="circles" id="circles" aria-hidden="true"></div>
      <div class="noise" aria-hidden="true"></div>

      <header class="menubar">
        <div class="menu-left">
          <a class="menu-cv" href="index.html" data-cursor="hover">(cv)</a>
          <span class="menu-year">2026</span>
        </div>
        <span class="menu-spacer"></span>
        <span class="menu-clock" id="clock"></span>
      </header>

      <div class="marquee" aria-hidden="true">
        <div class="marquee-track" id="marquee-track"></div>
      </div>

      <section class="wallpaper" aria-label="Portada del portfolio">
        <h1 class="hero">
          <span class="welcome" id="welcome" data-cursor="text">welcome to my</span>
          <span class="script-row">
            <span class="script" id="script" data-cursor="text">portfolio</span>
            <span class="year-orbit" id="year" data-cursor="hover">2026</span>
          </span>
        </h1>

        <p class="hint" id="hint">clic en las letras · arrastra los archivos · clic abre</p>

        <footer class="cover-meta">
          <div>
            <p>DESIGN<br />PORTFOLIO</p>
            <p class="meta-name">KILIAN TORRES</p>
            <p>
              <button type="button" class="mail-launch" data-window="mail" data-cursor="hover">
                kiliante2000@gmail.com
              </button>
            </p>
          </div>
          <p class="cover-role">( GRAPHIC DESIGNER / FULL STACK )</p>
        </footer>
      </section>

      <div class="icons" id="icons"></div>
      <div class="windows" id="windows"></div>

      <nav class="dock" id="dock" aria-label="Dock">
        <button class="dock-item" data-window="finder" data-cursor="hover" title="Escritorio">
          <span class="dock-glyph" aria-hidden="true">
            <svg viewBox="0 0 52 44" overflow="visible">
              <rect x="3.2" y="3.2" width="45.6" height="36.6" fill="#f4f1ea" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/>
              <path d="M3.2 3.2h45.6v10H3.2z" fill="#f4f1ea" stroke="#111" stroke-width="1.4"/>
              <circle cx="10.4" cy="8.2" r="2" fill="#ff3838"/>
              <circle cx="16.8" cy="8.2" r="2" fill="#cbf52a"/>
              <circle cx="23.2" cy="8.2" r="2" fill="#ff783a"/>
              <path d="M11 19.2h12.5l3.2 3.2h14.3V34.8H11z" fill="#152dff"/>
            </svg>
          </span>
          <span class="dock-label">escritorio</span>
        </button>
        <button class="dock-item" data-window="about" data-cursor="hover" title="Sobre mí">
          <span class="dock-glyph" aria-hidden="true">
            <svg viewBox="0 0 52 44" overflow="visible">
              <path d="M15.2 3.2h13.6L38.8 13.2v23.6c0 1.6-1.3 2.9-2.9 2.9H15.2c-1.6 0-2.9-1.3-2.9-2.9V6.1c0-1.6 1.3-2.9 2.9-2.9z" fill="#f8f7f4" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/>
              <path d="M28.8 3.2v10h10" fill="none" stroke="#111" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
              <text x="25.5" y="26.5" text-anchor="middle" dominant-baseline="middle" font-size="11" font-family="Times, serif" fill="#111">KT</text>
            </svg>
          </span>
          <span class="dock-label">sobre mí</span>
        </button>
        <button class="dock-item" data-window="photo" data-cursor="hover" title="Kilian.png">
          <span class="dock-glyph dock-photo" aria-hidden="true"></span>
          <span class="dock-label">kilian.png</span>
        </button>
        <a class="dock-item" href="index.html" data-cursor="hover" title="Currículum">
          <span class="dock-glyph" aria-hidden="true">
            <svg viewBox="0 0 52 44" overflow="visible">
              <path d="M15.2 3.2h13.6L38.8 13.2v23.6c0 1.6-1.3 2.9-2.9 2.9H15.2c-1.6 0-2.9-1.3-2.9-2.9V6.1c0-1.6 1.3-2.9 2.9-2.9z" fill="#cbf52a" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/>
              <path d="M28.8 3.2v10h10" fill="none" stroke="#111" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
              <path d="M18.6 22.6h14.6M18.6 28.6h10.4" fill="none" stroke="#111" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="dock-label">cv.pdf</span>
        </a>
        <button class="dock-item dock-trash" id="dock-trash" data-window="trash" data-cursor="hover" title="Papelera">
          <span class="dock-glyph dock-can" aria-hidden="true"></span>
          <span class="dock-label">papelera</span>
          <span class="dock-badge" hidden aria-hidden="true">0</span>
        </button>
      </nav>
    </div>

    <script src="js/protect.js?v=1"></script>
    <script src="js/desktop.js?v=desk8"></script>
  </body>
</html>
