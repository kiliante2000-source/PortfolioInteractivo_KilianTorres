<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magua Canaria — Kilian Torres</title>
    <link rel="icon" href="magua/img/Sol.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #f4f1ea;
        --ink: #111;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--paper);
        color: var(--ink);
        cursor: default;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: #f6f1e8;
        cursor: default;
      }
      body {
        display: grid;
        grid-template-rows: auto 1fr;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
      }
      .chrome {
        position: sticky;
        top: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        min-height: 44px;
        padding: 6px 12px;
        background: var(--paper);
        border-bottom: 1.5px solid var(--ink);
      }
      .back {
        color: var(--ink);
        text-decoration: none;
        border: 1px solid var(--ink);
        padding: 6px 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 11px;
        background: var(--paper);
        cursor: pointer;
      }
      @media (orientation: landscape) and (max-height: 560px) {
        body {
          grid-template-rows: 1fr;
        }
        .chrome {
          position: fixed;
          top: max(6px, env(safe-area-inset-top));
          left: max(6px, env(safe-area-inset-left));
          z-index: 50;
          min-height: 0;
          padding: 0;
          background: transparent;
          border: 0;
        }
      }
    </style>
  </head>
  <body>
    <header class="chrome">
      <a class="back" id="back" href="../portfolio.html">← volver al portfolio</a>
    </header>
    <iframe id="studio" title="Magua Canaria" src="magua/index.html?v=m14" allow="fullscreen; autoplay" allowfullscreen></iframe>
    <script>
      const COLORS = [
        { bg: "#ff783a", fg: "#111111" },
        { bg: "#152dff", fg: "#f4f1ea" },
        { bg: "#ec76e5", fg: "#111111" },
        { bg: "#cbf52a", fg: "#111111" },
        { bg: "#ff3838", fg: "#f4f1ea" },
      ];
      const back = document.getElementById("back");
      const studio = document.getElementById("studio");
      let last = -1;

      function paint() {
        let next = Math.floor(Math.random() * COLORS.length);
        if (COLORS.length > 1 && next === last) next = (next + 1) % COLORS.length;
        last = next;
        const color = COLORS[next];
        back.style.background = color.bg;
        back.style.color = color.fg;
      }

      function clear() {
        back.style.background = "";
        back.style.color = "";
      }

      function forceNativeCursor() {
        try {
          const doc = studio.contentDocument;
          if (!doc) return;
          doc.body?.classList.remove("has-pointer");
          doc.querySelectorAll(".pointer-glow, .cursor-sun").forEach((el) => el.remove());
          let sheet = doc.getElementById("force-native-cursor");
          if (!sheet) {
            sheet = doc.createElement("style");
            sheet.id = "force-native-cursor";
            (doc.head || doc.documentElement).appendChild(sheet);
          }
          sheet.textContent =
            "html,body,html *,body *{cursor:auto!important}" +
            "a,button,[type=button],label,summary,.btn{cursor:pointer!important}" +
            ".pointer-glow,.cursor-sun{display:none!important}";
        } catch (err) {}
      }

      studio.addEventListener("load", forceNativeCursor);
      if (studio.contentDocument?.readyState === "complete") forceNativeCursor();

      back.addEventListener("pointerenter", paint);
      back.addEventListener("pointerleave", clear);
      back.addEventListener("focus", paint);
      back.addEventListener("blur", clear);
    </script>
  </body>
</html>
